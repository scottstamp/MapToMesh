[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "maptomesh-native"
version = "0.1.0"
description = "Optional native speed-ups for MapToMesh (3MF writer)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.maturin]
module-name = "maptomesh_native"
